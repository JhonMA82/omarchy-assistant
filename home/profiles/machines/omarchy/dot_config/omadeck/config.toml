# omadeck configuration - edit by hand or with the `omadeck` app.

brightness = 52

[style]
follow_theme = true

[[key]]
index = 0
label = "Monitors"
show_label = false
icon = "icons/monitor-duo.svg"

[key.action]
type = "page"
page = "Monitors"

[[key]]
index = 1
label = "Browser"
show_label = false
icon = "icons/zen-browser.svg"

[key.action]
type = "app"
command = "omarchy launch browser"

[[key]]
index = 2
label = "Files"
show_label = false
icon = "icons/org.gnome.nautilus.png"

[key.action]
type = "app"
command = "omarchy launch nautilus"

[[key]]
index = 3
label = "Screenshot"
show_label = false
icon = "icons/applets-screenshooter.png"

[key.action]
type = "app"
command = "omarchy capture screenshot"

[[key]]
index = 5
label = "kitty"
icon = "icons/kitty.png"

[key.action]
type = "app"
command = "kitty --working-directory=/home/juan/Dev"

[[key]]
