[[page]]
name = "Herdr"

[[page.key]]
index = 0
label = "Back"
glyph = "󰁍"

[page.key.action]
type = "back"

[[page.key]]
index = 1
label = "New tab"

[page.key.action]
type = "app"
command = "herdr tab create --focus"

[[page.key]]
index = 2
label = "Split →"

[page.key.action]
type = "app"
command = "herdr pane split --direction right --current"

[[page.key]]
index = 3
label = "Split ↓"

[page.key.action]
type = "app"
command = "herdr pane split --direction down --current"

[[page.key]]
index = 4
label = "Zoom"

[page.key.action]
type = "app"
command = "herdr pane zoom --current"

[[page.key]]
index = 5
label = "←"

[page.key.action]
type = "app"
command = "herdr pane focus --direction left --current"

[[page.key]]
index = 6
label = "↓"

[page.key.action]
type = "app"
command = "herdr pane focus --direction down --current"

[[page.key]]
index = 7
label = "↑"

[page.key.action]
type = "app"
command = "herdr pane focus --direction up --current"

[[page.key]]
index = 8
label = "→"

[page.key.action]
type = "app"
command = "herdr pane focus --direction right --current"

[[page.key]]
index = 9
label = "Close pane"

[page.key.action]
type = "app"
command = "herdr pane current | jq -r .result.pane.pane_id | xargs -r herdr pane close"

[[page.key]]
index = 10
label = "Prev tab"

[page.key.action]
type = "app"
command = "herdr tab list | jq -r '.result.tabs as $t | ($t | map(.focused) | index(true)) as $i | ($t | length) as $n | $t[(($i - 1 + $n) % $n)].tab_id' | xargs -r herdr tab focus"

[[page.key]]
index = 11
label = "Next tab"

[page.key.action]
type = "app"
command = "herdr tab list | jq -r '.result.tabs as $t | ($t | map(.focused) | index(true)) as $i | ($t | length) as $n | $t[(($i + 1) % $n)].tab_id' | xargs -r herdr tab focus"

[[page.key]]
index = 12
label = "New ws"

[page.key.action]
type = "app"
command = "herdr workspace create --focus"

[[page.key]]
index = 13
label = "Close tab"

[page.key.action]
type = "app"
command = "herdr tab list | jq -r '.result.tabs[] | select(.focused) | .tab_id' | xargs -r herdr tab close"

[[page.key]]
index = 14
label = "Detach"

[page.key.action]
type = "app"
command = "wtype -M ctrl -k space -m ctrl -k d"
